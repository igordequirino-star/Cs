name: Alerta de atividades atrasadas (Artia → Teams)

on:
  schedule:
    # Dias úteis às 07:50 em America/Sao_Paulo (10:50 UTC; o Brasil não tem horário de verão).
    - cron: "50 10 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só gerar o card (não envia ao Teams nem grava o snapshot)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerta-atrasadas-5272141
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Consultar Artia e enviar ao Teams
        env:
          ARTIA_CLIENT_ID: ${{ secrets.ARTIA_CLIENT_ID }}
          ARTIA_CLIENT_SECRET: ${{ secrets.ARTIA_CLIENT_SECRET }}
          ARTIA_ORGANIZATION_ID: ${{ vars.ARTIA_ORGANIZATION_ID }}
          ARTIA_USER_ID: ${{ vars.ARTIA_USER_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python scripts/alerta_atrasadas.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Gravar snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "Snapshot sem alterações."
          else
            git commit -m "Atualiza snapshot de atrasadas do projeto 5272141 ($(TZ=America/Sao_Paulo date +%F))"
            git push
          fi
